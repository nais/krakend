[env]
IMG = "europe-north1-docker.pkg.dev/nais-io/nais/images/krakend-operator:latest"
ENVTEST_K8S_VERSION = "1.33.0"
CONTAINER_TOOL = "docker"
LOCALBIN = "{{config_root}}/bin"

[tools]
go = "1.26"
kubebuilder = "3.12.0"
"go:sigs.k8s.io/kustomize/kustomize/v5" = "5.6.0"
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.20.1"
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "latest"
"go:github.com/arttor/helmify/cmd/helmify" = "0.4.18"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.12.2"

[tasks.manifests]
description = "Generate WebhookConfiguration, ClusterRole and CustomResourceDefinition objects"
run = "controller-gen rbac:roleName=manager-role crd webhook paths='./...' output:crd:artifacts:config=config/crd/bases"

[tasks.generate]
description = "Generate code containing DeepCopy, DeepCopyInto, and DeepCopyObject method implementations"
run = "controller-gen object:headerFile='hack/boilerplate.go.txt' paths='./...'"

[tasks.fmt]
description = "Run go fmt against code"
run = "go fmt ./..."

[tasks.lint]
description = "Run golangci-lint against code"
run = "golangci-lint run"

[tasks.vet]
description = "Run go vet against code"
run = "go vet ./..."

[tasks.test]
description = "Run tests"
depends = ["manifests", "generate", "fmt", "vet"]
run = """
KUBEBUILDER_ASSETS="$(setup-envtest use ${ENVTEST_K8S_VERSION} --bin-dir ${LOCALBIN} -p path)" \
  go test ./... -coverprofile cover.out
"""

[tasks.build]
description = "Build manager binary"
depends = ["manifests", "generate", "fmt", "vet"]
run = "go build -o bin/manager cmd/main.go"

[tasks.run]
description = "Run a controller from your host"
depends = ["manifests", "generate", "fmt", "vet"]
run = "go run ./cmd/main.go -metrics-bind-address=127.0.0.1:8080 -health-probe-bind-address=127.0.0.1:8081 -debug"

[tasks.helm]
description = "Package Helm chart"
run = "helm package installer/krakend -d charts/krakend-operator"

[tasks.helm-generate]
description = "Generate Helm chart from kustomize"
depends = ["manifests"]
run = "kustomize build config/default | helmify charts/krakend-operator"

[tasks.helm-crds]
description = "Generate Helm CRD chart from kustomize"
depends = ["generate", "manifests"]
run = "kustomize build config/crd | helmify charts/krakend-operator-crds"

[tasks.docker-build]
description = "Build docker image with the manager"
run = "${CONTAINER_TOOL} build -t ${IMG} ."

[tasks.docker-push]
description = "Push docker image with the manager"
run = "${CONTAINER_TOOL} push ${IMG}"

[tasks.install]
description = "Install CRDs into the K8s cluster specified in ~/.kube/config"
depends = ["manifests"]
run = "kustomize build config/crd | kubectl apply -f -"

[tasks.uninstall]
description = "Uninstall CRDs from the K8s cluster specified in ~/.kube/config"
depends = ["manifests"]
run = "kustomize build config/crd | kubectl delete --ignore-not-found=true -f -"

[tasks.deploy]
description = "Deploy controller to the K8s cluster specified in ~/.kube/config"
depends = ["manifests"]
run = """
cd config/manager && kustomize edit set image controller=${IMG}
kustomize build config/default | kubectl apply -f -
"""

[tasks.undeploy]
description = "Undeploy controller from the K8s cluster specified in ~/.kube/config"
run = "kustomize build config/default | kubectl delete --ignore-not-found=true -f -"

[tasks.vulncheck]
description = "Run govulncheck"
run = "go run golang.org/x/vuln/cmd/govulncheck@latest ./..."

[tasks.check]
description = "Run lint and vulncheck"
depends = ["lint", "vulncheck"]







