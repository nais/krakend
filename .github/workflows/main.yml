name: Container Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "debugapp/**"
      - ".github/workflows/debugapp.yml"
      - ".github/workflows/test.yml"
      - ".github/workflows/updatechart.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: oci://europe-north1-docker.pkg.dev/nais-io/nais
  SERVICE_ACCOUNT: gh-krakend
  NAME: krakend-operator

permissions:
  contents: read

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # ratchet:jdx/mise-action@v4
      - name: Lint
        run: mise run lint

  build:
    name: Build and Test code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # ratchet:jdx/mise-action@v4
      - name: Vet code
        run: mise run vet
      - name: Test code
        run: mise run test
      - name: Check krakend config
        run: mise run krakend-check
      - name: Build binary
        run: mise run build

  build_push:
    outputs:
      version: ${{ steps.build-push-sign.outputs.version }}
    permissions:
      contents: "read"
      id-token: "write"
    name: Build and push to GAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: nais/platform-build-push-sign@df590279b21bc5978519685752f9eaddd546043c # ratchet:nais/platform-build-push-sign@main
        id: build-push-sign
        with:
          name: ${{ env.NAME }}
          google_service_account: ${{ env.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push: true
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # ratchet:azure/setup-helm@v4
        name: "Setup Helm"
        with:
          version: "3.21.0"
      - name: Build Chart
        run: |-
          sed -i "s/^version: .*/version: ${{ steps.build-push-sign.outputs.version }}/g" charts/krakend-operator/Chart.yaml
          sed -i "s/^version: .*/version: ${{ steps.build-push-sign.outputs.version }}/g" charts/krakend-operator-crds/Chart.yaml

          helm package charts/krakend-operator
          helm package charts/krakend-operator-crds
      - name: Push Chart
        run: |-
          helm push krakend-operator-${{ steps.build-push-sign.outputs.version }}.tgz ${{ env.IMAGE_REPOSITORY }}
          helm push krakend-operator-crds-${{ steps.build-push-sign.outputs.version }}.tgz ${{ env.IMAGE_REPOSITORY }}

  build_push_krakend:
    permissions:
      contents: "read"
      id-token: "write"
    name: Build and push krakend image to GAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
      # job-level path filters are not supported, and skipping the job would skip the rollouts that need it
      - name: Check for krakend/ changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" != "push" ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- krakend/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Read krakend version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: echo "tag=$(sed -n 's/^FROM krakend:\([^@]*\)@.*/\1/p' krakend/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: nais/platform-build-push-sign@df590279b21bc5978519685752f9eaddd546043c # ratchet:nais/platform-build-push-sign@main
        if: steps.changes.outputs.changed == 'true'
        with:
          name: krakend
          context: krakend
          dockerfile: krakend/Dockerfile
          extra_tags: ${{ steps.version.outputs.tag }}
          multi-platform: true
          google_service_account: ${{ env.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push: true

  rollout-controller:
    needs:
      - lint
      - build
      - build_push
      - build_push_krakend
    runs-on: fasit-deploy
    permissions:
      id-token: write
    steps:
      - uses: nais/fasit-deploy@58a70a338b16dc646373c91724fc7e7522d085a4 # ratchet:nais/fasit-deploy@v4.0.1
        with:
          chart: ${{ env.IMAGE_REPOSITORY }}/krakend-operator
          version: ${{ needs.build_push.outputs.version }}
          # TODO: KrakenD v3 upgrade, only dev-nais for now. Restore ci-nais, nav and onprem nav targets after verification.
          targets: |
            [
              { "target": { "kind": "tenant", "tenant": "dev-nais" } }
            ]

  rollout-crds:
    needs:
      - lint
      - build
      - build_push
    runs-on: fasit-deploy
    permissions:
      id-token: write
    steps:
      - uses: nais/fasit-deploy@58a70a338b16dc646373c91724fc7e7522d085a4 # ratchet:nais/fasit-deploy@v4.0.1
        with:
          chart: ${{ env.IMAGE_REPOSITORY }}/krakend-operator-crds
          version: ${{ needs.build_push.outputs.version }}
          # TODO: KrakenD v3 upgrade, only dev-nais for now. Restore ci-nais, nav and onprem nav targets after verification.
          targets: |
            [
              { "target": { "kind": "tenant", "tenant": "dev-nais" } }
            ]
