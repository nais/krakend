name: Update Krakend Image

on:
  workflow_dispatch:
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run once a day
    - cron: "0 0 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  updatecli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@e71be7554f3f940bc439cf720b3e4e379823c562 # ratchet:updatecli/updatecli-action@v3.2.0

      - name: Run Updatecli in Dry Run mode
        run: updatecli diff --config hack/updatecli.d

      - name: Run Updatecli in Apply mode
        run: updatecli apply --config hack/updatecli.d

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # ratchet:peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): upgrade krakend image"
          title: "chore(deps): upgrade KrakenD image"
          body: |
            Automatic upgrade of the KrakenD image tag using https://github.com/updatecli/updatecli.

            Check release notes at https://github.com/krakend/krakend-ce/releases.
          branch: upgrade-krakend-image
          base: main
          labels: dependencies
          delete-branch: true
