apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: change-me
  namespace: change-me
spec:
  image: set-in-code
  port: 8080
  prometheus:
    enabled: true
    path: /metrics
    port: set-in-code
  env:
    - name: USAGE_DISABLE
      value: "1"
  liveness:
    path: /__health
    initialDelay: 20
    periodSeconds: 10
  readiness:
    path: /__health
